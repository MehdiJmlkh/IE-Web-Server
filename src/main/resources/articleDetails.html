<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/showArticles.css" />
    <link rel="stylesheet" href="css/articleDetails.css" />
</head>
<body>
    <div class="navbar">
        <a href="ShowArticles">
            <img class="navbar__icon" src="images/icon.png" alt="">
        </a>
        <form action="filter-articles" method="post" class="search-box">
            <input name="search" class="search-box__input" type="text" placeholder="Search papers...">
        </form>
        <a href="AddArticle" class="navbar__btn btn btn-primary">Add Paper</a>
    </div>
    
    <h1 class="article-title">{title}</h1>
    <div>{year}</div>
    <div class="abstract">
        <h2 class="abstract__header">Abstract</h2>
        <p>{abstract}</p>
    </div>
    <div class="body">
        <h2 class="body__header">Body</h2>
        <div>{body}</div>
    </div>
    <div class="citations">
        <h2 class="citation__header">Citations</h2>
        <div>{citations}</div>
    </div>
</body>
</html>
