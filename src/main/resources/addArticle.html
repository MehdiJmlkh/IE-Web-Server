<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/addArticle.css" />
</head>
<body>
    <form action="/addarticle" method="post" class="form">
        <div>
            <label class="form-label" for="title">Title</label>
            <input class="form-control" id="title" type="text" name="title">
        </div>
        <div>
            <label class="form-label" for="abstract">Abstract</label>
            <textarea class="form-control" id="abstract" name="abstract" rows="5"></textarea>
        </div>
        <button class="form__btn btn btn-primary" type="submit">Submit</button>
    </form>
</body>
 <script>
    document.querySelector("form").addEventListener("submit", function (e) {
        e.preventDefault();

        const form = this;

        fetch(form.action, {
            method: form.method,
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: new URLSearchParams(new FormData(form))
        }).then(() => form.reset());
    });
</script>
</html>
