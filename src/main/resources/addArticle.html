<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/addArticle.css" />
</head>
<body>
    <form action="/addarticle" method="post" class="form">
        <div>
            <label class="form-label title-label" for="title">Title</label>
            <input class="form-control" id="title" type="text" name="title" required>
        </div>
        <div>
            <label class="form-label" for="year">Publication Year</label>
            <input class="form-control" id="year" type="number" name="year" value="{currentYear}" required>
        </div>
        <div>
            <label class="form-label" for="abstract">Abstract</label>
            <textarea class="form-control" id="abstract" name="abstract" rows="5" required></textarea>
        </div>
        <div>
            <label class="form-label" for="body">Body</label>
            <textarea class="form-control" id="body" name="body" rows="10"></textarea>
        </div>
        <div>
            <label class="form-label">Citations</label>
            <div>
                {articles}
            </div>
        </div>
        <button class="form__btn btn btn-primary" type="submit">Submit</button>
    </form>
</body>
</html>
